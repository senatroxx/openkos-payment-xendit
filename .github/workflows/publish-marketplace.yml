name: Publish release to Marketplace

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    uses: senatroxx/openkos-marketplace-api/.github/workflows/publish-release-to-marketplace.yml@36625f59dc4b06589471f0c6f136960f34f141b9
    with:
      release_tag: ${{ github.event.release.tag_name }}
      marketplace_url: ${{ vars.OPENKOS_MARKETPLACE_URL }}
    secrets:
      marketplace_publish_token: ${{ secrets.OPENKOS_MARKETPLACE_PUBLISH_TOKEN }}
