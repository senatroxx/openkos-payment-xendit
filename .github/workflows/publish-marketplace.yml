name: Publish release to Marketplace

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    uses: senatroxx/openkos-marketplace-api/.github/workflows/publish-release-to-marketplace.yml@a990c1e990ff98e1c18c4711e6d96a7ea2369ee0
    with:
      release_tag: ${{ github.event.release.tag_name }}
      marketplace_url: ${{ vars.OPENKOS_MARKETPLACE_URL }}
    secrets:
      marketplace_publish_token: ${{ secrets.OPENKOS_MARKETPLACE_PUBLISH_TOKEN }}
