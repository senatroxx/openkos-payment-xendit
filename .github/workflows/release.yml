name: CI

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  OPENKOS_VALIDATOR_REF: 831acd59a424c76d0a74f41ad6d3dbd3a4478fbf

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.4", "8.5"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress --no-scripts
      - run: composer validate --strict
      - run: composer run lint
      - run: composer test

  artifact:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: "8.4"
          extensions: mbstring, dom, pdo_sqlite, sqlite3
          coverage: none
      - name: Build and validate runtime artifact
        shell: bash
        run: |
          set -euo pipefail

          manifest_id="$(jq -er '.id | select(type == "string" and length > 0)' manifest.json)"
          manifest_entry="$(jq -er '.entry_class | select(type == "string" and length > 0)' manifest.json)"
          manifest_version="$(jq -er '.version | select(type == "string" and length > 0)' manifest.json)"
          composer_name="$(jq -er '.name | select(type == "string" and length > 0)' composer.json)"
          composer_entry="$(jq -er '.extra.openkos.plugin | select(type == "string" and length > 0)' composer.json)"
          plugin_count="$(jq -er '[.extra.openkos.plugin] | map(select(type == "string" and length > 0)) | length' composer.json)"

          test "$manifest_id" = "$composer_name"
          test "$manifest_entry" = "$composer_entry"
          test "$plugin_count" -eq 1

          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            test "${GITHUB_REF_NAME#v}" = "$manifest_version"
            test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          fi

          build_root="$RUNNER_TEMP/runtime-plugin-build"
          artifact_root="$RUNNER_TEMP/runtime-plugin-artifact"
          rm -rf "$build_root" "$artifact_root"
          mkdir -p "$build_root" "$artifact_root" "$GITHUB_WORKSPACE/dist"

          for path in src config routes database resources; do
            if [[ -e "$path" ]]; then
              cp -a "$path" "$build_root/$path"
            fi
          done

          jq '
            del(.require.php, .require["composer/semver"], .require["openkos/platform"], .require["laravel/framework"])
            | .require |= with_entries(select(
                ((.key | startswith("illuminate/")) | not)
                and ((.key | startswith("laravel/")) | not)
                and ((.key | startswith("ext-")) | not)
            ))
            | del(.["require-dev"])
          ' composer.json > "$build_root/composer.json"

          php -r '
            $composer = json_decode(file_get_contents($argv[1]), true, 512, JSON_THROW_ON_ERROR);
            $lock = json_decode(file_get_contents($argv[2]), true, 512, JSON_THROW_ON_ERROR);
            $isHost = static fn (string $name): bool => in_array($name, ["composer/semver", "openkos/platform", "laravel/framework"], true)
                || str_starts_with($name, "illuminate/")
                || str_starts_with($name, "laravel/");
            $packages = [];
            foreach ($lock["packages"] ?? [] as $package) {
                if (is_array($package) && is_string($package["name"] ?? null)) {
                    $packages[$package["name"]] = $package;
                }
            }
            $pending = [];
            foreach (array_keys($composer["require"] ?? []) as $name) {
                if (is_string($name) && $name !== "php" && ! str_starts_with($name, "ext-") && ! $isHost($name)) {
                    $pending[] = $name;
                }
            }
            $selected = [];
            while ($pending !== []) {
                $name = array_shift($pending);
                if (! is_string($name) || $isHost($name) || isset($selected[$name])) {
                    continue;
                }
                if (! isset($packages[$name])) {
                    $providers = [];
                    foreach ($packages as $candidateName => $candidate) {
                        foreach (["provide", "replace"] as $field) {
                            if (is_array($candidate[$field] ?? null) && array_key_exists($name, $candidate[$field])) {
                                $providers[] = $candidateName;
                                break;
                            }
                        }
                    }
                    if ($providers === []) {
                        throw new RuntimeException("Locked production dependency [{$name}] is missing.");
                    }
                    array_push($pending, ...$providers);
                    continue;
                }
                $selected[$name] = true;
                foreach (array_keys($packages[$name]["require"] ?? []) as $dependency) {
                    if (is_string($dependency) && $dependency !== "php" && ! str_starts_with($dependency, "ext-") && ! $isHost($dependency)) {
                        $pending[] = $dependency;
                    }
                }
            }
            $lock["packages"] = array_values(array_filter(
                $lock["packages"] ?? [],
                static fn (mixed $package): bool => is_array($package) && isset($selected[$package["name"] ?? ""]),
            ));
            $lock["packages-dev"] = [];
            file_put_contents($argv[3], json_encode($lock, JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES | JSON_THROW_ON_ERROR).PHP_EOL);
          ' composer.json composer.lock "$build_root/composer.lock"

          composer install \
            --working-dir="$build_root" \
            --no-dev \
            --no-interaction \
            --prefer-dist \
            --no-progress \
            --no-scripts \
            --no-plugins

          cp manifest.json composer.json composer.lock "$artifact_root/"
          cp -a "$build_root/vendor" "$artifact_root/vendor"
          for path in src config routes database resources; do
            if [[ -e "$build_root/$path" ]]; then
              cp -a "$build_root/$path" "$artifact_root/$path"
            fi
          done

          for path in openkos/platform laravel/framework illuminate laravel; do
            if [[ -e "$artifact_root/vendor/$path" || -L "$artifact_root/vendor/$path" ]]; then
              echo "Forbidden host package path bundled: vendor/$path" >&2
              exit 1
            fi
          done

          php -r '
            $installed = require $argv[1];
            $versions = is_array($installed["versions"] ?? null) ? $installed["versions"] : $installed;
            foreach ($versions as $package => $metadata) {
                if (! is_string($package) || ! ($package === "openkos/platform" || $package === "laravel/framework" || str_starts_with($package, "illuminate/") || str_starts_with($package, "laravel/"))) {
                    continue;
                }
                if (! is_array($metadata)) {
                    fwrite(STDERR, "Malformed host package metadata bundled: {$package}\n");
                    exit(1);
                }
                $version = $metadata["pretty_version"] ?? null;
                $virtual = false;
                foreach (["provided", "replaced"] as $field) {
                    if (array_key_exists($field, $metadata)) {
                        if (! is_array($metadata[$field]) || ! array_is_list($metadata[$field]) || $metadata[$field] === [] || count(array_filter($metadata[$field], static fn (mixed $range): bool => is_string($range) && trim($range) !== "")) !== count($metadata[$field])) {
                            fwrite(STDERR, "Malformed host package metadata bundled: {$package}\n");
                            exit(1);
                        }
                        $virtual = true;
                    }
                }
                if ((is_string($version) && trim($version) !== "") || ! $virtual) {
                    fwrite(STDERR, "Forbidden host package metadata bundled: {$package}\n");
                    exit(1);
                }
            }
          ' "$artifact_root/vendor/composer/installed.php"

          commit_epoch="$(git show -s --format=%ct "$GITHUB_SHA")"
          find "$artifact_root" -type f -exec chmod 0644 {} +
          find "$artifact_root" -type f -exec touch --date="@$commit_epoch" {} +

          artifact_name="${manifest_id#*/}-${manifest_version}"
          zip_path="$GITHUB_WORKSPACE/dist/$artifact_name.zip"
          checksum_path="$GITHUB_WORKSPACE/dist/$artifact_name.sha256"
          (
            cd "$artifact_root"
            find . -type f -printf '%P\n' | LC_ALL=C sort | zip -X -q "$zip_path" -@
          )
          checksum="$(sha256sum "$zip_path" | cut -d ' ' -f1)"
          printf '%s  %s\n' "$checksum" "$artifact_name.zip" > "$checksum_path"

      - name: Validate installation in clean OpenKOS
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$GITHUB_WORKSPACE/openkos"
          git clone --quiet https://github.com/senatroxx/OpenKos.git "$GITHUB_WORKSPACE/openkos"
          git -C "$GITHUB_WORKSPACE/openkos" fetch --quiet origin "$OPENKOS_VALIDATOR_REF"
          git -C "$GITHUB_WORKSPACE/openkos" checkout --quiet --detach "$OPENKOS_VALIDATOR_REF"
          composer install \
            --working-dir="$GITHUB_WORKSPACE/openkos" \
            --no-dev \
            --no-interaction \
            --prefer-dist \
            --no-progress \
            --no-scripts \
            --no-plugins

          cp "$GITHUB_WORKSPACE/openkos/.env.example" "$GITHUB_WORKSPACE/openkos/.env"
          (
            cd "$GITHUB_WORKSPACE/openkos"
            php artisan key:generate --force --no-interaction
          )

          zip_path="$(find "$GITHUB_WORKSPACE/dist" -maxdepth 1 -type f -name '*.zip' -print -quit)"
          test -n "$zip_path"
          runtime_path="$RUNNER_TEMP/openkos-runtime"
          rm -rf "$runtime_path"
          mkdir -p "$runtime_path"
          composer_json_before="$(sha256sum "$GITHUB_WORKSPACE/openkos/composer.json" | cut -d ' ' -f1)"
          composer_lock_before="$(sha256sum "$GITHUB_WORKSPACE/openkos/composer.lock" | cut -d ' ' -f1)"

          (
            cd "$GITHUB_WORKSPACE/openkos"
            OPENKOS_PLUGIN_PATH="$runtime_path" php artisan plugin:install "$zip_path" --no-interaction
          )

          manifest_id="$(jq -er '.id | select(type == "string" and length > 0)' manifest.json)"
          plugin_list="$(
            cd "$GITHUB_WORKSPACE/openkos"
            OPENKOS_PLUGIN_PATH="$runtime_path" php artisan plugin:list --no-interaction
          )"
          printf '%s\n' "$plugin_list"
          printf '%s\n' "$plugin_list" | grep -Fq "$manifest_id"
          printf '%s\n' "$plugin_list" | grep -Fq 'Enabled'

          test "$composer_json_before" = "$(sha256sum "$GITHUB_WORKSPACE/openkos/composer.json" | cut -d ' ' -f1)"
          test "$composer_lock_before" = "$(sha256sum "$GITHUB_WORKSPACE/openkos/composer.lock" | cut -d ' ' -f1)"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: runtime-plugin-${{ github.sha }}
          path: dist/*
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    needs: artifact
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: runtime-plugin-${{ github.sha }}
          path: release
      - name: Publish immutable release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          zip_path="$(find release -maxdepth 1 -type f -name '*.zip' -print -quit)"
          checksum_path="$(find release -maxdepth 1 -type f -name '*.sha256' -print -quit)"
          test -n "$zip_path"
          test -n "$checksum_path"
          (cd release && sha256sum -c "$(basename "$checksum_path")")
          gh release create "$GITHUB_REF_NAME" "$zip_path" "$checksum_path" \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
